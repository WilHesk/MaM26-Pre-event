<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Move a Mile Stockport - A creative street festival celebrating physical movement, creativity & community.">
    <title>Move a Mile — Stockport</title>
    <link rel="icon" type="image/svg+xml" href="MaM-Favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --mam-purple: #332A7C;
            --mam-lavender: #afa4d0;
            --mam-yellow: #FCB714;
            --mam-pink-dark: #CC356A;
            --mam-pink-light: #F27188;
            --mam-blue: #00A3C5;
            --text-dark: #1a1330;
            --bg-light: #fdfbf7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Top Header */
        .site-header {
            width: 100%;
            background: #ffffff;
            padding: 1.1rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(51, 42, 124, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .header-logo-wrap {
            max-width: 900px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-main-img {
            max-height: 72px;
            width: auto;
            max-width: 90%;
            object-fit: contain;
            display: block;
        }

        /* Hero Section */
        .hero-section {
            position: relative;
            background: linear-gradient(135deg, #fff2d7 0%, #e3f8fc 50%, #ffe9f0 100%);
            padding: 3.5rem 2rem 4.5rem 2rem;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background ambient orbs */
        .hero-section::before,
        .hero-section::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
        }

        .hero-section::before {
            width: 450px;
            height: 450px;
            background: #fedc90;
            top: -100px;
            left: -100px;
        }

        .hero-section::after {
            width: 500px;
            height: 500px;
            background: #c5f1fa;
            bottom: -120px;
            right: -100px;
        }

        .hero-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3.5rem;
            align-items: center;
        }

        /* Hero Left: Main Logo + Overlapping Quote */
        .hero-logo-col {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem;
        }

        .logo-quote-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 410px; /* 20% smaller than previous 520px */
            margin: 0 auto;
        }

        .hero-main-logo {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 15px 35px rgba(51, 42, 124, 0.12));
            animation: gentleBreathe 8s ease-in-out infinite alternate;
        }

        @keyframes gentleBreathe {
            0% {
                transform: translateY(0) scale(1);
            }
            100% {
                transform: translateY(-6px) scale(1.012);
            }
        }

        /* Quote Stage: Overlaps the bottom 10% of the main logo */
        .quote-stage {
            position: absolute;
            bottom: -2%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 390px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .quote-badge {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--mam-yellow);
            border-radius: 18px;
            padding: 0.65rem 1.25rem;
            box-shadow: 0 12px 30px rgba(51, 42, 124, 0.16);
            width: 95%;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            pointer-events: auto;
        }

        .quote-layer {
            position: absolute;
            max-width: 90%;
            max-height: 65px;
            width: auto;
            height: auto;
            object-fit: contain;
            opacity: 0;
            transform: translateY(14px) scale(0.95);
            transition: opacity 0.6s cubic-bezier(0.2, 0.9, 0.3, 1), transform 0.7s cubic-bezier(0.2, 0.9, 0.3, 1);
            display: block;
        }

        .quote-layer.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .quote-layer.exiting {
            opacity: 0;
            transform: translateY(-10px) scale(0.97);
            transition: opacity 0.45s ease, transform 0.45s ease;
        }

        /* Hero Right: Photo Showcase */
        .hero-showcase-col {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .showcase-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 1.25rem 1.25rem 1rem 1.25rem;
            box-shadow: 0 25px 60px rgba(51, 42, 124, 0.14);
            max-width: 440px;
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }

        .showcase-card:hover {
            box-shadow: 0 30px 70px rgba(51, 42, 124, 0.18);
        }

        /* Photo Stage */
        .photo-stage {
            width: 100%;
            aspect-ratio: 4 / 5;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: #f0ecf6;
            box-shadow: 0 8px 24px rgba(51, 42, 124, 0.08);
            cursor: pointer;
        }

        .photo-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: scale(1.05);
            transition: opacity 0.85s cubic-bezier(0.25, 1, 0.5, 1), transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }

        .photo-layer.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .photo-layer.exiting {
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.65s ease, transform 0.65s ease;
        }

        /* Showcase Controls & Progress */
        .showcase-footer {
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 0.65rem;
            border-top: 1px solid rgba(51, 42, 124, 0.08);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .showcase-btn {
            background: #ffffff;
            border: 1px solid rgba(51, 42, 124, 0.15);
            color: var(--mam-purple);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 3px 8px rgba(51, 42, 124, 0.08);
            transition: all 0.2s ease;
            user-select: none;
        }

        .showcase-btn:hover {
            background: var(--mam-purple);
            color: #ffffff;
            border-color: var(--mam-purple);
            transform: scale(1.08);
            box-shadow: 0 6px 14px rgba(51, 42, 124, 0.2);
        }

        .showcase-btn:active {
            transform: scale(0.95);
        }

        .showcase-counter {
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--mam-purple);
            opacity: 0.75;
            letter-spacing: 1px;
            min-width: 60px;
            text-align: center;
        }

        .progress-bar-wrap {
            flex: 1;
            margin-left: 1rem;
            height: 4px;
            background: rgba(51, 42, 124, 0.08);
            border-radius: 99px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--mam-pink-dark), var(--mam-yellow));
            border-radius: 99px;
            transition: width 0.1s linear;
        }

        /* Stockport Vibes Section */
        .vibes-section {
            background-color: #afa4d0;
            padding: 3.5rem 2rem;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .vibes-container {
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vibes-img {
            width: 100%;
            max-width: 1100px;
            height: auto;
            display: block;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.06));
        }

        /* Sponsors Section */
        .sponsors-section {
            background-color: #ffffff;
            padding: 4.5rem 2rem 5rem 2rem;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sponsors-container {
            max-width: 1250px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sponsors-img {
            width: 100%;
            max-width: 1050px;
            height: auto;
            display: block;
            opacity: 0.95;
            transition: opacity 0.3s ease;
        }

        .sponsors-img:hover {
            opacity: 1;
        }

        /* Responsive Breakpoints */
        @media (max-width: 950px) {
            .hero-section {
                padding: 2.75rem 1.5rem 3.5rem 1.5rem;
            }

            .hero-container {
                grid-template-columns: 1fr;
                gap: 3rem;
            }

            .logo-quote-wrapper {
                max-width: 320px; /* 20% smaller */
            }

            .quote-stage {
                max-width: 310px;
                bottom: -4%;
            }

            .quote-badge {
                min-height: 70px;
                padding: 0.5rem 1rem;
            }

            .quote-layer {
                max-height: 55px;
            }

            .showcase-card {
                max-width: 390px;
            }
        }

        @media (max-width: 600px) {
            .site-header {
                padding: 0.85rem 1rem;
            }

            .header-main-img {
                max-height: 48px;
            }

            .hero-section {
                padding: 1.75rem 1rem 2.75rem 1rem;
            }

            .hero-container {
                gap: 2.5rem;
            }

            .logo-quote-wrapper {
                max-width: 255px; /* 20% smaller so photo is prominently above the fold */
            }

            .quote-stage {
                max-width: 250px;
                bottom: -5%;
            }

            .quote-badge {
                min-height: 60px;
                padding: 0.4rem 0.85rem;
                border-radius: 14px;
            }

            .quote-layer {
                max-height: 48px;
            }

            .showcase-card {
                padding: 1rem 1rem 0.85rem 1rem;
                border-radius: 18px;
                max-width: 340px;
            }

            .vibes-section {
                padding: 2.25rem 1rem;
            }

            .sponsors-section {
                padding: 3rem 1rem 3.5rem 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header with Main Header.svg in centre -->
    <header class="site-header">
        <div class="header-logo-wrap">
            <img src="Logos and GFX/Main Header.svg" alt="Move a Mile" class="header-main-img">
        </div>
    </header>

    <!-- Hero Section -->
    <main>
        <section class="hero-section">
            <div class="hero-container">
                
                <!-- Left: Main logo.svg with Overlapping Quote (covering bottom 10%) -->
                <div class="hero-logo-col">
                    <div class="logo-quote-wrapper">
                        <img src="Logos and GFX/Main logo.svg" alt="Move a Mile Stockport" class="hero-main-logo">
                        
                        <!-- Dynamic quote badge sitting over the bottom 10% of the main logo -->
                        <div class="quote-stage" id="quote-stage">
                            <div class="quote-badge">
                                <img id="quote-layer-a" class="quote-layer active" src="" alt="Move a Mile Event Quote">
                                <img id="quote-layer-b" class="quote-layer" src="" alt="Move a Mile Event Quote">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right: Photo Showcase (sitting comfortably and cleanly on desktop) -->
                <div class="hero-showcase-col">
                    <div class="showcase-card" id="showcase-card">
                        
                        <!-- Photo Stage -->
                        <div class="photo-stage" id="photo-stage" title="Click or tap to view next">
                            <img id="photo-layer-a" class="photo-layer active" src="" alt="Move a Mile Event Photo">
                            <img id="photo-layer-b" class="photo-layer" src="" alt="Move a Mile Event Photo">
                        </div>

                        <!-- Footer Controls & Progress Bar -->
                        <div class="showcase-footer">
                            <div class="controls-group">
                                <button class="showcase-btn" id="btn-prev" aria-label="Previous photo and quote">&#10094;</button>
                                <div class="showcase-counter">
                                    <span id="counter-current">1</span> / <span id="counter-total">30</span>
                                </div>
                                <button class="showcase-btn" id="btn-next" aria-label="Next photo and quote">&#10095;</button>
                            </div>
                            <div class="progress-bar-wrap">
                                <div class="progress-bar-fill" id="progress-bar"></div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </section>

        <!-- Stockport Vibes SVG on #afa4d0 background -->
        <section class="vibes-section">
            <div class="vibes-container">
                <img src="Logos and GFX/Stockport Vibes.svg" alt="Stockport Vibes" class="vibes-img">
            </div>
        </section>

        <!-- Sponsors WebP sitting under Stockport Vibes -->
        <section class="sponsors-section">
            <div class="sponsors-container">
                <img src="Logos and GFX/Sponsors.webp" alt="Supported by our sponsors" class="sponsors-img">
            </div>
        </section>
    </main>

    <!-- Animation & Showcase Script -->
    <script>
        (function() {
            // Generate list of 30 quote-photo pairs (1.0 to 30.0)
            const TOTAL_ITEMS = 30;
            const items = [];
            for (let i = 1; i <= TOTAL_ITEMS; i++) {
                items.push({
                    number: i,
                    photo: `Quote Photos/MaM26 Stockport Quote Photo ${i}.0.webp`,
                    quote: `Quotes/MaM26 Stockport Quote ${i}.0.svg`
                });
            }

            // Elements
            const photoA = document.getElementById('photo-layer-a');
            const photoB = document.getElementById('photo-layer-b');
            const quoteA = document.getElementById('quote-layer-a');
            const quoteB = document.getElementById('quote-layer-b');
            const counterCurrent = document.getElementById('counter-current');
            const counterTotal = document.getElementById('counter-total');
            const progressBar = document.getElementById('progress-bar');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const photoStage = document.getElementById('photo-stage');
            const showcaseCard = document.getElementById('showcase-card');

            counterTotal.textContent = TOTAL_ITEMS;

            let currentIndex = 0;
            let currentLayer = 'A'; // Which layer is currently visible
            let isTransitioning = false;
            let isHovered = false;

            // Timer settings (chilled out duration: 5.5s per item)
            const DISPLAY_DURATION = 5500;
            let elapsed = 0;
            let timerInterval = null;

            // Initial load
            photoA.src = items[0].photo;
            quoteA.src = items[0].quote;
            photoA.classList.add('active');
            quoteA.classList.add('active');

            // Preload next images in background for instant responsiveness
            function preloadItems(fromIdx) {
                for (let k = 1; k <= 3; k++) {
                    const nextIdx = (fromIdx + k) % TOTAL_ITEMS;
                    const imgP = new Image();
                    imgP.src = items[nextIdx].photo;
                    const imgQ = new Image();
                    imgQ.src = items[nextIdx].quote;
                }
            }
            preloadItems(0);

            // Transition function: dynamic but chilled out
            function showItem(index, direction = 'next') {
                if (isTransitioning) return;
                isTransitioning = true;
                currentIndex = index;

                counterCurrent.textContent = currentIndex + 1;
                elapsed = 0;
                progressBar.style.width = '0%';

                const nextData = items[currentIndex];

                const activePhoto = currentLayer === 'A' ? photoA : photoB;
                const nextPhoto = currentLayer === 'A' ? photoB : photoA;

                const activeQuote = currentLayer === 'A' ? quoteA : quoteB;
                const nextQuote = currentLayer === 'A' ? quoteB : quoteA;

                // 1. Prepare incoming elements in background
                nextPhoto.src = nextData.photo;
                nextQuote.src = nextData.quote;

                // Reset incoming classes
                nextPhoto.classList.remove('active', 'exiting');
                nextQuote.classList.remove('active', 'exiting');

                // 2. Chilled dynamic choreography:
                // First exit outgoing elements smoothly
                activePhoto.classList.add('exiting');
                activePhoto.classList.remove('active');

                activeQuote.classList.add('exiting');
                activeQuote.classList.remove('active');

                // 3. Staggered entrance: Quote appears over the logo first, then Photo fades in
                setTimeout(() => {
                    nextQuote.classList.remove('exiting');
                    nextQuote.classList.add('active');
                }, 180);

                setTimeout(() => {
                    nextPhoto.classList.remove('exiting');
                    nextPhoto.classList.add('active');
                }, 320);

                // Flip active layer and allow next transition
                setTimeout(() => {
                    activePhoto.classList.remove('exiting');
                    activeQuote.classList.remove('exiting');
                    currentLayer = currentLayer === 'A' ? 'B' : 'A';
                    isTransitioning = false;
                    preloadItems(currentIndex);
                }, 900);
            }

            function nextItem() {
                const nextIdx = (currentIndex + 1) % TOTAL_ITEMS;
                showItem(nextIdx, 'next');
            }

            function prevItem() {
                const prevIdx = (currentIndex - 1 + TOTAL_ITEMS) % TOTAL_ITEMS;
                showItem(prevIdx, 'prev');
            }

            // Controls
            btnNext.addEventListener('click', () => {
                nextItem();
            });

            btnPrev.addEventListener('click', () => {
                prevItem();
            });

            // Clicking/tapping the photo triggers next
            photoStage.addEventListener('click', () => {
                nextItem();
            });

            // Pause on hover
            showcaseCard.addEventListener('mouseenter', () => {
                isHovered = true;
            });
            showcaseCard.addEventListener('mouseleave', () => {
                isHovered = false;
            });

            // Mobile swipe support
            let touchStartX = 0;
            let touchStartY = 0;
            let isSwiping = false;

            photoStage.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                isSwiping = true;
            }, { passive: true });

            photoStage.addEventListener('touchmove', (e) => {
                if (!isSwiping) return;
                const diffX = e.touches[0].clientX - touchStartX;
                const diffY = e.touches[0].clientY - touchStartY;
                if (Math.abs(diffY) > Math.abs(diffX)) {
                    isSwiping = false;
                }
            }, { passive: true });

            photoStage.addEventListener('touchend', (e) => {
                if (!isSwiping) return;
                const diffX = e.changedTouches[0].clientX - touchStartX;
                if (diffX < -40) {
                    nextItem();
                } else if (diffX > 40) {
                    prevItem();
                }
                isSwiping = false;
            });

            // Progress bar and automatic chilled rotation loop
            const TICK = 50;
            timerInterval = setInterval(() => {
                if (!isHovered && !isTransitioning) {
                    elapsed += TICK;
                    const percent = Math.min(100, (elapsed / DISPLAY_DURATION) * 100);
                    progressBar.style.width = percent + '%';

                    if (elapsed >= DISPLAY_DURATION) {
                        nextItem();
                    }
                }
            }, TICK);

        })();
    </script>
</body>
</html>
